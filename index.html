<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon carnet Italie</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#16252a;--mut:#5f6f73;--line:#e1ddd3;--head:#0f3b40;--gold:#c79a3a;--f:#0f5a62;--h:#7a3b63;--chip:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1719;--card:#17252a;--ink:#edf1ee;--mut:#9fb0b3;--line:#27393d;--head:#0a2a2e;--gold:#e0b552;--f:#6cc3cb;--h:#d99ac0;--chip:#17252a}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:10;background:var(--head);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.wrap{max-width:820px;margin:0 auto}
h1{margin:0 0 10px;font-size:1.25rem;letter-spacing:.2px}
h1 span{color:var(--gold)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:#6b7b7e}
.search input{width:100%;border:0;border-radius:12px;padding:12px 40px 12px 40px;font:inherit;background:#fff;color:#16252a}
.search input:focus{outline:3px solid var(--gold)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:1.4rem;color:#6b7b7e;width:36px;height:36px;cursor:pointer;display:none}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;padding:9px 6px;border-radius:10px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#16252a}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 2px;max-width:820px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 13px;border-radius:99px;font:inherit;font-size:.88rem;cursor:pointer}
.chips button b{color:var(--mut);font-weight:600;margin-left:4px}
.chips button.on{background:var(--head);color:#fff;border-color:var(--head)}
.chips button.on b{color:var(--gold)}
main{max-width:820px;margin:0 auto;padding:6px 14px calc(40px + env(safe-area-inset-bottom,0px))}
.count{color:var(--mut);font-size:.85rem;margin:10px 0 0}
h2{margin:22px 0 10px;font-size:1.1rem;display:flex;align-items:baseline;gap:8px;padding-bottom:7px;border-bottom:2px solid var(--gold)}
h2 small{color:var(--mut);font-weight:500;font-size:.82rem}
.grid{display:grid;gap:12px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--f)}
.card.h::before{background:var(--h)}
.card h3{margin:0 0 4px;font-size:1.02rem;line-height:1.25}
.town{display:inline-block;font-size:.76rem;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--f);margin-bottom:4px}
.card.h .town{color:var(--h)}
.card p{margin:2px 0;font-size:.92rem;color:var(--mut)}
.card p.who{color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;position:relative;z-index:2}
.acts a{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:99px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.85rem;background:var(--bg)}
.acts a svg{width:16px;height:16px;flex:none}
.acts a.map{background:var(--head);color:#fff;border-color:var(--head);font-weight:600}
.acts a.map::after{content:"";position:absolute;inset:-200px -14px -12px -14px;z-index:-1}
.acts a.wa{color:#0b7a3b;border-color:#0b7a3b55}
@media(prefers-color-scheme:dark){.acts a.wa{color:#5fd68f}.acts a.map{background:#1e5d63}}
.acts a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
</style>
</head>

<div class="top"><div class="wrap">
  <h1>Mon carnet <span>Italie</span></h1>

    <input id="q" type="search" placeholder="Rechercher par nom..." autocomplete="off" enterkeyhint="search">
    <button id="x" aria-label="Effacer">&times;</button>

</div></div>
<div class="chips" id="chips"></div>
<main><p class="count" id="count"></p><div id="list"></div></main>

const IC = {
  tel:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  wa:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>',
  mail:'<path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M22 6l-10 7L2 6"/>',
  web:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/>',
  pin:'<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const mapUrl = m => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(m);

const st = {q:"", c:"", r:""};
const ORDER = [...new Set(DATA.map(d=>d.r))];
ORDER.sort((a,b)=> DATA.filter(d=>d.r===b).length - DATA.filter(d=>d.r===a).length);

function match(d, skipRegion){
  if (st.c && d.c !== st.c) return false;
  if (!skipRegion && st.r && d.r !== st.r) return false;
  if (st.q){
    const hay = norm([d.n,d.p,d.t,d.a,d.o].join(" "));
    return st.q.split(/\s+/).every(w => hay.includes(w));
  }
  return true;
}

function card(d){
  const acts = [`<a class="map" href="${mapUrl(d.m)}" target="_blank" rel="noopener">${svg("pin")}Map</a>`];
  d.ph.forEach(p => acts.push(`<a href="tel:${p.tel}">${svg("tel")}${esc(p.show)}</a>`));
  d.wa.forEach(t => acts.push(`<a class="wa" href="https://wa.me/${t.replace("+","")}" target="_blank" rel="noopener">${svg("wa")}WhatsApp</a>`));
  d.e.forEach(e => acts.push(`<a href="mailto:${esc(e)}">${svg("mail")}Email</a>`));
  if (d.w) acts.push(`<a href="${esc(d.w)}" target="_blank" rel="noopener">${svg("web")}Site</a>`);
  return `<article class="card ${d.c}">
    <span class="town">${esc(d.t)}</span>
    <h3>${esc(d.n)}</h3>
    ${d.p ? `<p class="who"><b>${esc(d.p)}</b>${d.f ? " &middot; " + esc(d.f) : ""}</p>` : ""}
    <p>${esc(d.a)}</p>
    ${d.o ? `<p>${esc(d.o)}</p>` : ""}
    <div class="acts">${acts.join("")}</div>
  </article>`;
}

function render(){
  // pastilles regions (comptage selon recherche + type)
  const chips = [`<button data-r="" class="${st.r===""?"on":""}">Toutes<b>${DATA.filter(d=>match(d,true)).length}</b></button>`]
    .concat(ORDER.map(r => {
      const n = DATA.filter(d => d.r===r && match(d,true)).length;
      return n ? `<button data-r="${esc(r)}" class="${st.r===r?"on":""}">${esc(r)}<b>${n}</b></button>` : "";
    }));
  document.getElementById("chips").innerHTML = chips.join("");

  const found = DATA.filter(d => match(d,false));
  document.getElementById("count").textContent = found.length + (found.length>1 ? " resultats" : " resultat");
  document.getElementById("x").style.display = st.q ? "block" : "none";

  if (!found.length){
    document.getElementById("list").innerHTML = '<div class="empty">Aucun resultat.</div>';
    return;
  }
  document.getElementById("list").innerHTML = ORDER.map(r => {
    const items = found.filter(d => d.r===r)
      .sort((a,b)=> a.t.localeCompare(b.t) || a.n.localeCompare(b.n));
    if (!items.length) return "";
    return `<section><h2>${esc(r)}<small>${items.length}</small></h2><div class="grid">${items.map(card).join("")}</div></section>`;
  }).join("");
}

const q = document.getElementById("q");
q.addEventListener("input", () => { st.q = norm(q.value).trim(); render(); });
document.getElementById("x").addEventListener("click", () => { q.value=""; st.q=""; render(); q.focus(); });
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  st.c = b.dataset.c;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x===b));
  render();
});
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  st.r = b.dataset.r; render();
});
render();
</script>
