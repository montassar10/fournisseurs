<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon carnet Italie</title>
<meta name="theme-color" content="#0f3b40">
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#16252a;--mut:#5f6f73;--line:#e1ddd3;--head:#0f3b40;--gold:#c79a3a;--f:#0f5a62;--h:#7a3b63;--chip:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1719;--card:#17252a;--ink:#edf1ee;--mut:#9fb0b3;--line:#27393d;--head:#0a2a2e;--gold:#e0b552;--f:#6cc3cb;--h:#d99ac0;--chip:#17252a}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:10;background:var(--head);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.wrap{max-width:820px;margin:0 auto}
h1{margin:0 0 10px;font-size:1.25rem;letter-spacing:.2px}
h1 span{color:var(--gold)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:#6b7b7e}
.search input{width:100%;border:0;border-radius:12px;padding:12px 40px 12px 40px;font:inherit;background:#fff;color:#16252a}
.search input:focus{outline:3px solid var(--gold)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:1.4rem;color:#6b7b7e;width:36px;height:36px;cursor:pointer;display:none}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;padding:9px 6px;border-radius:10px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#16252a}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 2px;max-width:820px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 13px;border-radius:99px;font:inherit;font-size:.88rem;cursor:pointer}
.chips button b{color:var(--mut);font-weight:600;margin-left:4px}
.chips button.on{background:var(--head);color:#fff;border-color:var(--head)}
.chips button.on b{color:var(--gold)}
main{max-width:820px;margin:0 auto;padding:6px 14px calc(40px + env(safe-area-inset-bottom,0px))}
.count{color:var(--mut);font-size:.85rem;margin:10px 0 0}
h2{margin:22px 0 10px;font-size:1.1rem;display:flex;align-items:baseline;gap:8px;padding-bottom:7px;border-bottom:2px solid var(--gold)}
h2 small{color:var(--mut);font-weight:500;font-size:.82rem}
.grid{display:grid;gap:12px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--f)}
.card.h::before{background:var(--h)}
.card h3{margin:0 0 4px;font-size:1.02rem;line-height:1.25}
.town{display:inline-block;font-size:.76rem;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--f);margin-bottom:4px}
.card.h .town{color:var(--h)}
.card p{margin:2px 0;font-size:.92rem;color:var(--mut)}
.card p.who{color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;position:relative;z-index:2}
.acts a{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:99px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.85rem;background:var(--bg)}
.acts a svg{width:16px;height:16px;flex:none}
.acts a.map{background:var(--head);color:#fff;border-color:var(--head);font-weight:600}
.acts a.map::after{content:"";position:absolute;inset:-200px -14px -12px -14px;z-index:-1}
.acts a.wa{color:#0b7a3b;border-color:#0b7a3b55}
@media(prefers-color-scheme:dark){.acts a.wa{color:#5fd68f}.acts a.map{background:#1e5d63}}
.acts a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.vtabs{display:flex;gap:6px;margin:0 0 10px}
.vtabs button{flex:1;border:0;background:rgba(255,255,255,.12);color:#fff;padding:9px 6px;border-radius:10px;font:inherit;font-size:.92rem;font-weight:600;cursor:pointer}
.vtabs button.on{background:#fff;color:var(--head)}
.imgs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin:-2px -2px 10px;scrollbar-width:none;background:var(--bg);border-radius:8px;padding:8px}
.imgs::-webkit-scrollbar{display:none}
.imgs img{flex:0 0 100%;width:100%;max-height:260px;object-fit:contain;scroll-snap-align:center;border-radius:4px;cursor:zoom-in;display:block}
.imgs.multi img{flex-basis:92%}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 8px calc(16px + env(safe-area-inset-bottom,0px))}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.6rem;width:42px;height:42px;border-radius:50%;cursor:pointer}
.day{display:flex;gap:8px;overflow-x:auto;margin:14px 0 4px;scrollbar-width:none}
.day button{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:9px 15px;border-radius:99px;font:inherit;font-size:.92rem;cursor:pointer}
.day button.on{background:var(--head);color:#fff;border-color:var(--head)}
.prog{margin:8px 0 4px;color:var(--mut);font-size:.88rem}
.bar{height:6px;background:var(--line);border-radius:9px;margin:6px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.stop{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px 56px;margin-bottom:10px}
.stop .no{position:absolute;left:12px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--head);color:#fff;display:grid;place-items:center;font-weight:700}
.stop.done{opacity:.6}
.stop.done .no{background:#2f8f5b}
.stop.done h3{text-decoration:line-through}
.stop h3{margin:0;font-size:1.02rem}
.stop .sub{margin:2px 0 0;font-size:.88rem;color:var(--mut)}
.chk{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:.95rem;cursor:pointer;padding:4px 0}
.chk input{width:22px;height:22px;accent-color:#2f8f5b}
.stop textarea{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink);resize:vertical;min-height:44px}
.pend{border-style:dashed}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
</style>
</head>

<div class="top"><div class="wrap">
  <h1>Mon carnet <span>Italie</span></h1>
  <div class="vtabs" id="vtabs"><button data-v="carnet" class="on">Carnet</button><button data-v="plan">Programme</button></div>
  <div id="tools">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input id="q" type="search" placeholder="Rechercher par nom..." autocomplete="off" enterkeyhint="search">
    <button id="x" aria-label="Effacer">&times;</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-c="" class="on">Tout</button>
    <button data-c="f">Fournisseurs</button>
    <button data-c="h">Hotels &amp; restos</button>
  </div>
  </div>
</div></div>
<div id="carnet"><div class="chips" id="chips"></div>
<main><p class="count" id="count"></p><div id="list"></div></main></div>
<main id="plan" hidden></main>

const IC = {
  tel:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  wa:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>',

  web:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/>',
  pin:'<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const mapUrl = m => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(m);

const st = {q:"", c:"", r:""};
const ORDER = [...new Set(DATA.map(d=>d.r))];
ORDER.sort((a,b)=> DATA.filter(d=>d.r===b).length - DATA.filter(d=>d.r===a).length || a.localeCompare(b));

function match(d, skipRegion){
  if (st.c && d.c !== st.c) return false;
  if (!skipRegion && st.r && d.r !== st.r) return false;
  if (st.q){
    const hay = norm([d.n,d.p,d.t,d.a,d.o].join(" "));
    return st.q.split(/\s+/).every(w => hay.includes(w));
  }
  return true;
}

function card(d){
  const acts = [`<a class="map" href="${mapUrl(d.m)}" target="_blank" rel="noopener">${svg("pin")}Map</a>`];
  d.ph.forEach(p => acts.push(`<a href="tel:${p.tel}">${svg("tel")}${esc(p.show)}</a>`));
  d.wa.forEach(t => acts.push(`<a class="wa" href="https://wa.me/${t.replace("+","")}" target="_blank" rel="noopener">${svg("wa")}WhatsApp</a>`));
  d.e.forEach(e => acts.push(`<a href="mailto:${esc(e)}">${svg("mail")}Email</a>`));
  if (d.w) acts.push(`<a href="${esc(d.w)}" target="_blank" rel="noopener">${svg("web")}Site</a>`);
  const imgs = d.i && d.i.length ? `<div class="imgs${d.i.length>1?" multi":""}">${d.i.map(f=>`<img src="cards/${f}.jpg" alt="Carte de visite ${esc(d.n)}" loading="lazy" data-zoom>`).join("")}</div>` : "";
  return `<article class="card ${d.c}">
    ${imgs}
    <span class="town">${esc(d.t)}</span>
    <h3>${esc(d.n)}</h3>
    ${d.p ? `<p class="who"><b>${esc(d.p)}</b>${d.f ? " &middot; " + esc(d.f) : ""}</p>` : ""}
    <p>${esc(d.a)}</p>
    ${d.o ? `<p>${esc(d.o)}</p>` : ""}
    <div class="acts">${acts.join("")}</div>
  </article>`;
}

function render(){
  // pastilles regions (comptage selon recherche + type)
  const chips = [`<button data-r="" class="${st.r===""?"on":""}">Toutes<b>${DATA.filter(d=>match(d,true)).length}</b></button>`]
    .concat(ORDER.map(r => {
      const n = DATA.filter(d => d.r===r && match(d,true)).length;
      return n ? `<button data-r="${esc(r)}" class="${st.r===r?"on":""}">${esc(r)}<b>${n}</b></button>` : "";
    }));
  document.getElementById("chips").innerHTML = chips.join("");

  const found = DATA.filter(d => match(d,false));
  document.getElementById("count").textContent = found.length + (found.length>1 ? " resultats" : " resultat");
  document.getElementById("x").style.display = st.q ? "block" : "none";

  if (!found.length){
    document.getElementById("list").innerHTML = '<div class="empty">Aucun resultat.</div>';
    return;
  }
  document.getElementById("list").innerHTML = ORDER.map(r => {
    const items = found.filter(d => d.r===r)
      .sort((a,b)=> a.t.localeCompare(b.t) || a.n.localeCompare(b.n));
    if (!items.length) return "";
    return `<section><h2>${esc(r)}<small>${items.length}</small></h2><div class="grid">${items.map(card).join("")}</div></section>`;
  }).join("");
}

const q = document.getElementById("q");
q.addEventListener("input", () => { st.q = norm(q.value).trim(); render(); });
document.getElementById("x").addEventListener("click", () => { q.value=""; st.q=""; render(); q.focus(); });
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  st.c = b.dataset.c;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x===b));
  render();
});
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  st.r = b.dataset.r; render();
});

/* ---------- Lightbox (agrandir la carte) ---------- */
const lb = document.getElementById("lb");
document.addEventListener("click", e => {
  const im = e.target.closest("img[data-zoom]");
  if (im){ lb.querySelector("img").src = im.src; lb.classList.add("on"); return; }
  if (e.target.closest("#lb")) lb.classList.remove("on");
});
document.addEventListener("keydown", e => { if (e.key==="Escape") lb.classList.remove("on"); });

/* ---------- Programme ---------- */
const byName = Object.fromEntries(DATA.map(d => [d.n, d]));
let save = {};
try { save = JSON.parse(localStorage.getItem("plan-v1") || "{}"); } catch(e) {}
function persist(){ try { localStorage.setItem("plan-v1", JSON.stringify(save)); } catch(e) {} }
let curDay = 0;
(function pickDay(){
  const today = new Date().toISOString().slice(0,10);
  const i = PLAN.findIndex(p => p.d >= today);
  curDay = i >= 0 ? i : 0;
})();

function renderPlan(){
  const day = PLAN[curDay];
  const id = (i) => day.d + "-" + i;
  const done = day.items.filter((_,i)=> (save[id(i)]||{}).done).length;
  const stops = day.items.map((it,i) => {
    const d = it.ref ? byName[it.ref] : null;
    const s = save[id(i)] || {};
    const title = d ? d.n : (it.who || "A preciser");
    const sub = d ? [d.t, it.who || d.p].filter(Boolean).join(" - ") : (it.tip || "");
    const acts = d ? [`<a class="map" href="${mapUrl(d.m)}" target="_blank" rel="noopener">${svg("pin")}Map</a>`]
      .concat(d.ph.slice(0,1).map(p => `<a href="tel:${p.tel}">${svg("tel")}Appeler</a>`))
      .concat(d.wa.slice(0,1).map(t => `<a class="wa" href="https://wa.me/${t.replace("+","")}" target="_blank" rel="noopener">${svg("wa")}WhatsApp</a>`)).join("") : "";
    return `<article class="stop ${s.done?"done":""} ${d?"":"pend"}" data-id="${id(i)}">
      <span class="no">${i+1}</span>
      <h3>${esc(title)}</h3>
      ${sub ? `<p class="sub">${esc(sub)}</p>` : ""}
      ${d ? `<p class="sub">${esc(d.a)}</p>` : ""}
      ${acts ? `<div class="acts" style="position:static">${acts}</div>` : ""}
      <label class="chk"><input type="checkbox" ${s.done?"checked":""}> Visite faite</label>
      <textarea placeholder="Notes, taches, prix...">${esc(s.note||"")}</textarea>
    </article>`;
  }).join("");
  document.getElementById("plan").innerHTML = `
    <div class="day">${PLAN.map((p,i)=>`<button data-day="${i}" class="${i===curDay?"on":""}">${esc(p.l)}</button>`).join("")}</div>
    <p class="prog">${done} / ${day.items.length} visites faites</p>
    <div class="bar"><i style="width:${day.items.length?Math.round(done/day.items.length*100):0}%"></i></div>
    ${stops}`;
}
const planEl = document.getElementById("plan");
planEl.addEventListener("click", e => {
  const b = e.target.closest("[data-day]");
  if (b){ curDay = +b.dataset.day; renderPlan(); }
});
planEl.addEventListener("change", e => {
  if (e.target.type !== "checkbox") return;
  const id = e.target.closest(".stop").dataset.id;
  (save[id] = save[id] || {}).done = e.target.checked; persist(); renderPlan();
});
planEl.addEventListener("input", e => {
  if (e.target.tagName !== "TEXTAREA") return;
  const id = e.target.closest(".stop").dataset.id;
  (save[id] = save[id] || {}).note = e.target.value; persist();
});

/* ---------- Onglets Carnet / Programme ---------- */
document.getElementById("vtabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const plan = b.dataset.v === "plan";
  document.querySelectorAll("#vtabs button").forEach(x => x.classList.toggle("on", x===b));
  document.getElementById("tools").hidden = plan;
  document.getElementById("carnet").hidden = plan;
  planEl.hidden = !plan;
  if (plan) renderPlan();
  window.scrollTo(0,0);
});
render();
</script>
</body>
</html>
